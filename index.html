
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors | Neon Arena</title>

    <link rel="stylesheet" href="RockPaperScissors.css">
    <script src="RockPaperScissors.js" defer></script>
</head>
<body>
    <main class="game-container">

        <header class="header">
            <h1>
                <span class="rock-title">ROCK</span>
                <span class="paper-title">PAPER</span>
                <span class="scissors-title">SCISSORS</span>
            </h1>
            <p class="tagline">CHOOSE <span>•</span> PLAY <span>•</span> WIN</p>
        </header>

        <section class="choices" aria-label="Choose your move">

            <button class="choice rock" id="rock" aria-label="Choose rock">
                <img src="rock.png" alt="Rock">
                <span>ROCK</span>
            </button>

            <button class="choice paper" id="paper" aria-label="Choose paper">
                <img src="paper.png" alt="Paper">
                <span>PAPER</span>
            </button>

            <button class="choice scissors" id="scissors" aria-label="Choose scissors">
                <img src="scissors.png" alt="Scissors">
                <span>SCISSORS</span>
            </button>

        </section>

        <section class="score-board" aria-label="Game scores">

            <div class="player">
                <div class="player-icon">👤</div>
                <div>
                    <p class="player-name">YOU</p>
                    <p id="user-score" class="score">0</p>
                </div>
            </div>

            <div class="versus">VS</div>

            <div class="player computer">
                <div class="player-icon">🤖</div>
                <div>
                    <p class="player-name">COMPUTER</p>
                    <p id="computer-score" class="score">0</p>
                </div>
            </div>

        </section>

        <section class="result-area">
            <p id="msg" class="message" aria-live="polite">
                🎮 Play Your Move
            </p>
            <p id="round-info" class="round-info">
                First to play, first to win!
            </p>
        </section>

        <button id="reset-btn" class="reset-btn">
            ↻ &nbsp; RESET GAME
        </button>

        <footer>
            <span></span>
            <p>♥</p>
            <span></span>
            <small>GOOD LUCK, CHAMP!</small>
        </footer>

    </main>
</body>
</html>
